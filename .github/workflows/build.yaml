# This is a basic workflow to help you get started with Actions

name: Docker build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the trunk branch
  push:
    branches: [ trunk ]

  pull_request:
    branches: [ trunk ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# env:
#   ODOX_URL:   https://github.com/ggabbiani/orthodocs/releases/download/v1.2.1

jobs:

  fedora:
    name: Fedora
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: git-actions:fedora
      DOCKER_IMAGE: ggabbiani/git-actions:fedora

    steps:

      # Checks-out repo on $GITHUB_WORKSPACE
      - name: Project checkout
        uses: actions/checkout@v7
        with:
          # Number of commits to fetch. 0 indicates all history for all branches
          # and tags (default 1).
          fetch-depth: '0'

      # Check if anything in docker/fedora/* or /bin/* changed with the last commit.
      # See also
      # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
      # and
      # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-output-parameter
      - name: Docker changes
        id: docker
        run: |
          set +e
          (git diff --name-only HEAD HEAD~1 | grep -e '^docker/fedora/' -e '^bin/' >/dev/null && echo yes || echo no) | xargs -I@ echo changed=@ >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Docker Hub Login
        if: steps.docker.outputs.changed=='yes'
        uses: docker/login-action@v4
        with:
          username: ggabbiani
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Docker image push after successful build, documentation make and tests execution
      - name: promote
        if: steps.docker.outputs.changed=='yes'
        run: |
          make docker/fedora
          docker tag ${IMAGE_NAME} ${DOCKER_IMAGE}
          docker push ${DOCKER_IMAGE}

